name: Build

# Builds PRs and tags (releases), but not pushes to master, because that's the same commit as the PR (or the tag) and would build it twice
on:
  push:
    tags:
      - '*'
  pull_request:
    paths-ignore:
      - '*.md'
  workflow_dispatch:

jobs:
  build-macos:
    name: build for macOS

    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
  
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install deps
        run: |
          # dav1d needs meson and ninja along with nasm to be built
          brew install nasm yasm python-setuptools meson

# Useful for debugging:
#      - name: Setup tmate session
#        uses: mxschmitt/action-tmate@v3

      - run: |
          echo "${{ github.ref }}"

      - name: Build ffmpeg
        run: |
          while sleep 300; do echo "=====[ $SECONDS seconds still running ]====="; done &
          ./build-ffmpeg --build
          kill %1

      - name: Check shared libraries and minimum macOS version
        run: |
          target=$(grep -m1 -o 'MACOSX_DEPLOYMENT_TARGET=[0-9.]*' build-ffmpeg | cut -d= -f2)
          for bin in ./workspace/bin/ffmpeg ./workspace/bin/ffprobe; do
            otool -L "$bin"
            # Only system libraries are allowed, see README
            if otool -L "$bin" | tail -n +2 | grep -vE '^[[:space:]]+/(System/Library|usr/lib)/'; then
              echo "::error::$bin links non-system libraries (above)"; exit 1
            fi
            minos=$(otool -l "$bin" | grep -A4 LC_BUILD_VERSION | awk '/minos/ { print $2 }')
            echo "$bin minos: $minos"
            if [ "$minos" != "$target" ]; then
              echo "::error::$bin minos $minos != MACOSX_DEPLOYMENT_TARGET $target"; exit 1
            fi
          done

      - name: Test run
        run: |
          ./workspace/bin/ffmpeg -buildconf
          ./workspace/bin/ffprobe -buildconf

      - name: Rename binaries
        run: |
          mv workspace/bin/ffmpeg workspace/bin/ffmpeg-macos-${{ runner.arch }}
          mv workspace/bin/ffprobe workspace/bin/ffprobe-macos-${{ runner.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacOS-${{ runner.arch }}
          path: |
            workspace/bin/ffmpeg-macos-${{ runner.arch }}
            workspace/bin/ffprobe-macos-${{ runner.arch }}
  
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          files: |
            workspace/bin/ffmpeg-macos-${{ runner.arch }}
            workspace/bin/ffprobe-macos-${{ runner.arch }}

  # Publish the draft release once all architectures have been uploaded
  publish:
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
