name: Check for new FFmpeg release

# Opens an issue when there is a newer FFmpeg release than FFMPEG_VERSION in build-ffmpeg
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(grep -m1 -o '^FFMPEG_VERSION=[0-9.]*' build-ffmpeg | cut -d= -f2)
          branch=$(echo "$current" | cut -d. -f1-2)
          tags=$(git ls-remote --tags --refs https://github.com/FFmpeg/FFmpeg 'n*' | sed 's|.*refs/tags/n||' | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V)
          latest_patch=$(echo "$tags" | grep -E "^${branch//./\\.}(\.|$)" | tail -1)
          latest=$(echo "$tags" | tail -1)
          echo "current $current, latest on $branch: $latest_patch, latest: $latest"

          new=""
          [ "$latest_patch" != "$current" ] && new="$latest_patch"
          [ -z "$new" ] && [ "$latest" != "$current" ] && new="$latest"
          [ -z "$new" ] && exit 0

          title="New FFmpeg release: $new"
          if gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$title\"" --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Issue already exists"; exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Current: $current. Latest on the $branch branch: $latest_patch. Latest release: $latest.

          Patch releases on our branch often contain security fixes, see https://ffmpeg.org/security.html
          See also the FFmpeg upgrade checklist in https://github.com/mifi/lossless-cut/blob/master/CONTRIBUTING.md"
